<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Task Reporting — Persona</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ============================================================
   SHEET URL CONFIGURATION
   To update: replace the URL below with your published CSV link
   File → Share → Publish to web → pick tab → CSV → copy URL
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; font-size: 13px; }

/* ── Sidebar ── */
.sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: #13151e; border-right: 1px solid #1e2333; display: flex; flex-direction: column; overflow-y: auto; z-index: 100; }
.logo { padding: 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e2333; }
.logo-icon { width: 28px; height: 28px; border-radius: 8px; background: #6366f1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; }
.logo-text { font-size: 14px; font-weight: 700; color: #f1f5f9; letter-spacing: -.02em; }
.logo-sub { font-size: 10px; color: #475569; margin-top: 1px; }
.search-wrap { padding: 12px; border-bottom: 1px solid #1e2333; }
.search-box { width: 100%; background: #1e2333; border: 1px solid #2d3548; border-radius: 8px; padding: 7px 10px; font-size: 12px; color: #94a3b8; outline: none; font-family: inherit; }
.search-box::placeholder { color: #475569; }
.nav-section { padding: 16px 0 4px; }
.nav-label { padding: 0 16px 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #475569; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 16px; font-size: 12.5px; color: #64748b; cursor: pointer; border-left: 2px solid transparent; transition: all .15s; }
.nav-item:hover { color: #cbd5e1; background: #1e2333; }
.nav-item.active { color: #a5b4fc; background: #1e2740; border-left-color: #6366f1; font-weight: 500; }
.nav-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.tier-group { padding: 4px 0; }
.tier-label { padding: 8px 16px 4px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #475569; display: flex; align-items: center; gap-6px; }
.tier-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; font-size: 9px; font-weight: 700; margin-right: 6px; }
.va-item { padding: 6px 16px 6px 28px; font-size: 12px; color: #64748b; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 7px; }
.va-item:hover { color: #cbd5e1; background: #1e2333; }
.va-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sidebar-bottom { margin-top: auto; padding: 12px; border-top: 1px solid #1e2333; }
.week-sel-wrap { display: flex; flex-direction: column; gap: 5px; }
.week-sel-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #475569; }
select.week-sel { width: 100%; background: #1e2333; border: 1px solid #2d3548; border-radius: 8px; padding: 7px 10px; font-size: 12px; color: #cbd5e1; font-family: inherit; outline: none; cursor: pointer; }

/* ── Main ── */
.main { margin-left: 220px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: #13151e; border-bottom: 1px solid #1e2333; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.page-title { font-size: 20px; font-weight: 700; color: #f1f5f9; letter-spacing: -.03em; }
.page-sub { font-size: 12px; color: #475569; margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.updated-text { font-size: 11px; color: #475569; display: flex; align-items: center; gap: 5px; }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
.btn-refresh { padding: 6px 14px; border-radius: 8px; border: 1px solid #2d3548; background: transparent; color: #94a3b8; font-size: 12px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: all .15s; }
.btn-refresh:hover { background: #1e2333; color: #cbd5e1; }
.date-range { padding: 6px 12px; border-radius: 8px; border: 1px solid #2d3548; background: #1e2333; color: #94a3b8; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.content { padding: 20px 24px; flex: 1; }

/* ── Live status bar ── */
.status-bar { background: #13151e; border: 1px solid #1e2333; border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; }
.status-bar-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.status-bar-title { font-size: 13px; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 7px; }
.status-legend { display: flex; gap: 14px; font-size: 11px; }
.sl-item { display: flex; align-items: center; gap: 4px; color: #64748b; }
.sl-dot { width: 7px; height: 7px; border-radius: 50%; }
.tier-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tier-col { }
.tier-col-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #475569; margin-bottom: 8px; }
.agent-chip { display: inline-flex; align-items: center; gap: 6px; background: #1e2333; border: 1px solid #2d3548; border-radius: 20px; padding: 4px 10px 4px 6px; margin: 3px; font-size: 11px; color: #94a3b8; }
.agent-chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.agent-task { color: #475569; font-size: 10px; margin-left: 2px; }

/* ── Weekly summary banner ── */
.summary-banner { background: linear-gradient(135deg, #312e81 0%, #1e1b4b 60%, #0f172a 100%); border: 1px solid #3730a3; border-radius: 14px; padding: 20px 24px; margin-bottom: 18px; }
.banner-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.banner-title { font-size: 15px; font-weight: 700; color: #e0e7ff; }
.banner-date { font-size: 12px; color: #818cf8; }
.banner-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-bottom: 1px solid #3730a350; padding-bottom: 18px; margin-bottom: 16px; }
.bm { padding-right: 24px; border-right: 1px solid #3730a350; margin-right: 0; }
.bm:last-child { border-right: none; padding-right: 0; padding-left: 24px; }
.bm:nth-child(2), .bm:nth-child(3) { padding-left: 24px; }
.bm-label { font-size: 11px; color: #818cf8; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.bm-label svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.bm-val { font-size: 26px; font-weight: 700; color: #e0e7ff; letter-spacing: -.04em; line-height: 1; }
.bm-sub { font-size: 11px; color: #6366f180; margin-top: 5px; }
.banner-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bt { background: #1e1b4b80; border: 1px solid #3730a340; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all .15s; }
.bt:hover { background: #1e1b4b; border-color: #6366f160; }
.bt-label { font-size: 11px; font-weight: 700; color: #818cf8; margin-bottom: 4px; display: flex; justify-content: space-between; }
.bt-agents { font-size: 10px; color: #475569; }
.bt-val { font-size: 15px; font-weight: 700; color: #c7d2fe; margin: 4px 0 2px; }
.bt-sub { font-size: 10px; color: #6366f1; }

/* ── Section header ── */
.sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; margin-top: 4px; }
.sec-title { font-size: 14px; font-weight: 600; color: #cbd5e1; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid #2d3548; background: transparent; color: #64748b; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .15s; display: flex; align-items: center; gap: 5px; }
.filter-btn:hover { background: #1e2333; color: #94a3b8; }
.filter-btn.active { background: #6366f120; border-color: #6366f1; color: #a5b4fc; }

/* ── Table ── */
.tbl-card { background: #13151e; border: 1px solid #1e2333; border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { padding: 10px 14px; background: #0f1117; border-bottom: 1px solid #1e2333; font-size: 11px; font-weight: 600; color: #475569; text-align: left; white-space: nowrap; letter-spacing: .03em; cursor: pointer; user-select: none; }
.tbl th:hover { color: #94a3b8; }
.tbl td { padding: 9px 14px; border-bottom: 1px solid #1a1f2e; color: #94a3b8; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: #1e233340; }
.tier-row-hdr td { background: #0f1117; color: #475569; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; border-bottom: 1px solid #1e2333; }
.va-row-hdr td { background: #1e2740; color: #a5b4fc; font-size: 12px; font-weight: 600; padding: 8px 14px; border-bottom: 1px solid #2d3548; }
.neg { color: #f87171 !important; font-weight: 500; }
.pos { color: #34d399 !important; font-weight: 500; }
.over-break td { background: #2d1b1b40; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }

/* ── Charts ── */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.chart-card { background: #13151e; border: 1px solid #1e2333; border-radius: 12px; padding: 16px; }
.chart-title { font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.chart-legend { display: flex; gap: 10px; flex-wrap: wrap; }
.cl-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #64748b; }
.cl-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* ── Metric cards ── */
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.mcard { background: #13151e; border: 1px solid #1e2333; border-radius: 12px; padding: 16px 18px; }
.mcard-lbl { font-size: 11px; color: #475569; margin-bottom: 8px; font-weight: 500; }
.mcard-val { font-size: 22px; font-weight: 700; color: #f1f5f9; letter-spacing: -.03em; line-height: 1; }
.mcard-sub { font-size: 11px; color: #475569; margin-top: 6px; }

/* ── Loading / error ── */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; gap: 12px; color: #475569; }
.spinner { width: 22px; height: 22px; border: 2px solid #1e2333; border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #2d1b1b; border: 1px solid #7f1d1d; border-radius: 10px; padding: 14px 18px; color: #fca5a5; font-size: 12.5px; margin-bottom: 16px; line-height: 1.8; }
.error-box code { background: #3b1515; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5"/><path d="M7 4v3l2 2"/></svg></div>
    <div>
      <div class="logo-text">Time Analyzer</div>
      <div class="logo-sub">Persona · Live</div>
    </div>
  </div>
  <div class="search-wrap">
    <input class="search-box" placeholder="Search VAs or tasks…" oninput="filterSearch(this.value)"/>
  </div>
  <div class="nav-section">
    <div class="nav-item active" onclick="nav('overview',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      Team Overview
    </div>
    <div class="nav-item" onclick="nav('tracking',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
      Time Tracking
    </div>
    <div class="nav-item" onclick="nav('freetime',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M8 2v4l3 3"/><circle cx="8" cy="8" r="6"/></svg>
      Free Time Analysis
    </div>
    <div class="nav-item" onclick="nav('scrub',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><polyline points="1,11 4,7 7,9 10,5 13,7 15,4"/></svg>
      Persona Scrub
    </div>
    <div class="nav-item" onclick="nav('support',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M13 5H3a1 1 0 00-1 1v6a1 1 0 001 1h10a1 1 0 001-1V6a1 1 0 00-1-1z"/><path d="M5 5V4a3 3 0 016 0v1"/></svg>
      Support Request
    </div>
    <div class="nav-item" onclick="nav('tasks',this)">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
      Task Breakdown
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">VAs</div>
    <div id="vaNav"></div>
  </div>
  <div class="sidebar-bottom">
    <div class="week-sel-wrap">
      <div class="week-sel-label">Week</div>
      <select class="week-sel" id="weekSel" onchange="onWeekChange()"></select>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title" id="pageTitle">Team Overview</div>
      <div class="page-sub" id="pageSub">Persona scrub time · weekly view</div>
    </div>
    <div class="topbar-right">
      <div class="updated-text"><div class="pulse"></div><span id="statusText">Connecting…</span></div>
      <button class="btn-refresh" onclick="loadData(true)">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16"><path d="M13.5 2.5A7 7 0 102 13.5"/><polyline points="13.5,2.5 13.5,6.5 9.5,6.5"/></svg>
        Refresh
      </button>
      <div class="date-range" id="dateRange">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M5 1v4M11 1v4M2 8h12"/></svg>
        <span id="dateRangeText">—</span>
      </div>
    </div>
  </div>
  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div><span>Fetching live data…</span></div>
  </div>
</div>

<script>
// ============================================================
//  UPDATE THIS URL — paste your published Google Sheet CSV link
// ============================================================
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0qDu1viah_9pJDZZeuL0ziS_K7x07DHQuO-q36rvFQVaVZLyC3HZbrNqHnhQmuFF8CFtFZX5DZDVY/pub?output=csv';
// ============================================================

const VA_COLORS = {
  'Monica':'#6366f1','Nolan Walker':'#22c55e','Amelia':'#a78bfa',
  'Danni':'#f59e0b','Hannah Carter':'#f43f5e','Allie Parker':'#06b6d4',
  'Jane Alderson':'#ec4899','Kath Prado':'#8b5cf6'
};
const TASK_COLORS = {
  'Free Time':'#22c55e','NPS Survey':'#6366f1','Break':'#475569',
  'Persona Scrub':'#a78bfa','Support Request':'#f59e0b',
  'Checking Emails':'#06b6d4','Follow up':'#ec4899','Meeting':'#f97316',
  'Calling in Orders':'#84cc16','Start of Shift':'#334155',
  'End of Shift':'#334155','Wrap up':'#334155','Idle':'#1e293b'
};

let allData=[], weeks=[], currentNav='overview', charts=[], activeFilter='all';

const vaC = n => VA_COLORS[n] || '#6366f1';
const taskC = t => TASK_COLORS[t] || '#475569';

function parseCSV(text){
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=[]; let cur='', inQ=false;
    for(let c of line){ if(c==='"'){inQ=!inQ;} else if(c===','&&!inQ){vals.push(cur);cur='';} else{cur+=c;} }
    vals.push(cur);
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}

function getWeekKey(d){
  if(!d)return null;
  const dt=new Date(d); if(isNaN(dt))return null;
  const day=dt.getDay(), diff=dt.getDate()-day+(day===0?-6:1), m=new Date(dt);
  m.setDate(diff); return m.toISOString().slice(0,10);
}
function fmtWeek(k){
  const d=new Date(k), e=new Date(k); e.setDate(e.getDate()+6);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' – ' + e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDate(d){ const dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtD(d){ const dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function toHM(hrs){ const h=Math.floor(hrs), m=Math.round((hrs-h)*60); return m>0?`${h}h ${m}m`:`${h}h`; }

async function loadData(force=false){
  document.getElementById('statusText').textContent='Fetching…';
  try{
    const resp = await fetch(SHEET_URL+'&t='+Date.now());
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text = await resp.text();
    allData = parseCSV(text);
    const wkSet=new Set();
    allData.forEach(r=>{
      const wk=r['Week Beginning']||getWeekKey(r['Shift Date']);
      if(wk) wkSet.add(String(wk).slice(0,10));
    });
    weeks=[...wkSet].filter(Boolean).sort();
    const sel=document.getElementById('weekSel');
    const prev=sel.value;
    sel.innerHTML='';
    weeks.forEach(w=>{ const o=document.createElement('option'); o.value=w; o.textContent=fmtWeek(w); sel.appendChild(o); });
    if(prev&&weeks.includes(prev)) sel.value=prev; else sel.value=weeks[weeks.length-1]||'';
    buildVANav();
    const now=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('statusText').textContent='Updated '+now;
    updateDateRange();
    render();
  } catch(e){
    document.getElementById('statusText').textContent='Error';
    document.getElementById('content').innerHTML=`<div class="error-box">
      <strong>Could not load sheet data.</strong><br><br>
      Make sure your Google Sheet is published:<br>
      1. Open Google Sheet → <strong>File → Share → Publish to web</strong><br>
      2. Select your tab → <strong>CSV</strong> → Publish<br>
      3. Copy the URL and update <code>SHEET_URL</code> at the top of this file<br><br>
      Error details: ${e.message}
    </div>`;
  }
}

function updateDateRange(){
  const wk=document.getElementById('weekSel').value;
  if(!wk) return;
  const d=new Date(wk), e=new Date(wk); e.setDate(e.getDate()+6);
  const fmt=dt=>dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('dateRangeText').textContent=fmt(d)+' – '+fmt(e);
  document.getElementById('pageSub').textContent='Week of '+fmtWeek(wk);
}

function getWeekData(){
  const wk=document.getElementById('weekSel').value;
  return allData.filter(r=>{
    const rw=r['Week Beginning']?String(r['Week Beginning']).slice(0,10):getWeekKey(r['Shift Date']);
    return rw===wk;
  });
}

function vaStats(){
  const data=getWeekData(), m={};
  data.forEach(r=>{
    const va=r['VA Name'], task=r['Task Type']; if(!va||!task)return;
    if(!m[va]) m[va]={totalMins:0,byTask:{},days:new Set()};
    const mins=parseFloat(r['Duration (mins)'])||0;
    m[va].totalMins+=mins; m[va].byTask[task]=(m[va].byTask[task]||0)+mins;
    const d=r['Shift Date']||r['Week Beginning']; if(d) m[va].days.add(String(d).slice(0,10));
  });
  return Object.entries(m).map(([name,v])=>({
    name, totalHrs:v.totalMins/60,
    scrubHrs:(v.byTask['Persona Scrub']||0)/60,
    supportHrs:(v.byTask['Support Request']||0)/60,
    freeHrs:(v.byTask['Free Time']||0)/60,
    breakHrs:(v.byTask['Break']||0)/60,
    npsHrs:(v.byTask['NPS Survey']||0)/60,
    byTask:v.byTask, days:v.days.size,
    daysSet:v.days
  })).sort((a,b)=>b.totalHrs-a.totalHrs);
}

function buildVANav(){
  const vas=[...new Set(allData.map(r=>r['VA Name']))].filter(Boolean).sort();
  document.getElementById('vaNav').innerHTML=vas.map(va=>
    `<div class="va-item" onclick="filterVA('${va}')">
      <div class="va-dot" style="background:${vaC(va)}"></div>

function sendPromptIfAvailable(t){ try{sendPrompt(t);}catch(e){} }
function filterSearch(q){ /* could highlight matching rows */ }

function clearCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }

function nav(page,el){
  currentNav=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const titles={overview:'Team Overview',tracking:'Time Tracking',freetime:'Free Time Analysis',scrub:'Persona Scrub',support:'Support Request',tasks:'Task Breakdown'};
  document.getElementById('pageTitle').textContent=titles[page]||page;
  clearCharts(); render();
}

function onWeekChange(){ updateDateRange(); clearCharts(); render(); }

function render(){
  if(!allData.length) return;
  if(currentNav==='overview') renderOverview();
  else if(currentNav==='tracking') renderTracking();
  else if(currentNav==='freetime') renderFreeTime();
  else if(currentNav==='scrub') renderScrub();
  else if(currentNav==='support') renderSupport();
  else if(currentNav==='tasks') renderTasks();
}

    </tr>`;

  });
  charts.push(c);

  vas.forEach(v=>{
    html+=`<tr>
      <td><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:50%;background:${vaC(v.name)}"></span><strong style="color:#cbd5e1">${v.name}</strong></span></td>
      <td style="color:#f59e0b;font-weight:500">${toHM(v.supportHrs)}</td>
      <td>${toHM(v.supportHrs/Math.max(v.days,1))}</td>
      <td>${v.days}d</td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
  const c=new Chart(document.getElementById('sp1'),{
    type:'bar',
    data:{labels:vas.map(v=>v.name),datasets:[{label:'Support hrs',data:vas.map(v=>+v.supportHrs.toFixed(3)),backgroundColor:vas.map(v=>vaC(v.name)),borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#475569'}},y:{ticks:{color:'#475569'},grid:{color:'#1e2333'}}}}
  });
  charts.push(c);
}

/* ── Tasks ── */
function renderTasks(){
  const data=getWeekData();
  const taskTotals={};
  data.forEach(r=>{const t=r['Task Type'],m=parseFloat(r['Duration (mins)'])||0;if(t)taskTotals[t]=(taskTotals[t]||0)+m;});
  const sorted=Object.entries(taskTotals).map(([t,m])=>({task:t,hrs:m/60})).sort((a,b)=>b.hrs-a.hrs);
  const maxH=sorted[0]?.hrs||1;
  let html=`<div class="sec-hdr"><div class="sec-title">All task types this week</div></div>`;
  sorted.forEach(({task,hrs})=>{
    const col=taskC(task);
    html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <div style="width:140px;font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${task}</div>
      <div style="flex:1;height:13px;background:#1e2333;border-radius:4px;overflow:hidden"><div style="height:100%;background:${col};width:${(hrs/maxH*100).toFixed(1)}%;border-radius:4px"></div></div>
      <div style="width:70px;font-size:11.5px;color:#475569;text-align:right">${toHM(hrs)}</div>
    </div>`;
  });
  html+=`<div class="chart-grid" style="margin-top:18px">
    <div class="chart-card"><div class="chart-title">Task distribution</div><div style="position:relative;height:220px"><canvas id="tk1"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Per-VA stacked breakdown</div><div style="position:relative;height:${Math.max(220,vaStats().length*50+80)}px"><canvas id="tk2"></canvas></div></div>
  </div>`;
  document.getElementById('content').innerHTML=html;
  const top=sorted.slice(0,8);
  const c1=new Chart(document.getElementById('tk1'),{
    type:'doughnut',
    data:{labels:top.map(t=>t.task),datasets:[{data:top.map(t=>+t.hrs.toFixed(2)),backgroundColor:top.map(t=>taskC(t.task)),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#64748b',font:{size:10},boxWidth:10}}}}
  });
  charts.push(c1);
  const vas=vaStats();
  const keys=['Persona Scrub','Support Request','NPS Survey','Break','Free Time','Checking Emails','Follow up','Meeting'];
  const c2=new Chart(document.getElementById('tk2'),{
    type:'bar',
    data:{labels:vas.map(v=>v.name),datasets:keys.map(tk=>({label:tk,data:vas.map(v=>+((v.byTask[tk]||0)/60).toFixed(2)),backgroundColor:taskC(tk),borderRadius:2}))},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{labels:{color:'#64748b',font:{size:10},boxWidth:9}}},scales:{x:{stacked:true,ticks:{color:'#475569'},grid:{color:'#1e2333'}},y:{stacked:true,ticks:{color:'#94a3b8',font:{size:11}}}}}
  });
  charts.push(c2);
}

loadData();
</script>
</body>
</html>
